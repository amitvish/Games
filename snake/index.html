<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f6f5f1;--card:#fff;--ink:#1a1a1a;--muted:#8a8a8a;--line:#e8e6e1;--accent:#111}
body{font-family:ui-sans-system,-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:22px;font-weight:800;letter-spacing:-0.03em}
.subtitle{font-size:13px;color:var(--muted);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center}
.stat .label{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)}
.stat .value{font-size:18px;font-weight:800;margin-top:4px;letter-spacing:-0.03em}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.controls .left{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mode{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.mode button{border:0;background:transparent;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;cursor:pointer;color:var(--muted);transition:.15s}
.mode button.active{background:var(--accent);color:white}
.btn{border:1px solid var(--line);background:white;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}
.btn:hover{transform:translateY(-1px)}
.stage{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.04)}
.canvas-wrap{position:relative;background:#0f0f0f;border-radius:14px;overflow:hidden;aspect-ratio:1;border:1px solid #1e1e1e}
canvas{width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;display:none;place-items:center;background:rgba(15,15,15,0.72);backdrop-filter:blur(6px);color:white;text-align:center;padding:20px}
.overlay.show{display:grid}
.overlay h2{font-size:22px;letter-spacing:-0.03em;margin-bottom:6px}
.overlay p{font-size:13px;color:#b9b9b9;margin-bottom:14px;line-height:1.5}
.overlay .row{display:flex;gap:10px;justify-content:center}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:180px;margin:14px auto 0}
.dpad button{aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:18px;cursor:pointer;display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.dpad button:active{background:var(--accent);color:white;border-color:var(--accent)}
.dpad .empty{background:transparent;border:0}
.hint{font-size:11px;color:var(--muted);font-weight:600;text-align:center;margin-top:10px;line-height:1.5}
.hint kbd{background:var(--accent);color:white;padding:2px 6px;border-radius:6px;font-size:10px;font-weight:700}
footer{text-align:center;font-size:12px;color:var(--muted)}
a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Snake</h1>
    <span class="subtitle">eat • grow • don't crash</span>
  </header>

  <div class="stats">
    <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
    <div class="stat"><div class="label">Speed</div><div class="value" id="speed">1×</div></div>
  </div>

  <div class="controls">
    <div class="left">
      <div class="mode" id="level">
        <button data-level="easy">Easy</button>
        <button data-level="medium" class="active">Medium</button>
        <button data-level="hard">Hard</button>
      </div>
      <span style="font-size:11px;color:var(--muted);font-weight:700" id="status">Ready</span>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" id="pauseBtn">Pause</button>
      <button class="btn primary" id="restartBtn">Restart</button>
    </div>
  </div>

  <div class="stage">
    <div class="canvas-wrap" id="wrap">
      <canvas id="c" width="400" height="400"></canvas>
      <div class="overlay show" id="overlay">
        <div>
          <h2 id="ovTitle">Snake</h2>
          <p id="ovDesc">Press <b>Space</b> or tap Start<br>Use arrow keys or swipe</p>
          <div class="row">
            <button class="btn primary" id="startBtn">Start</button>
            <button class="btn" id="howBtn" style="background:#2a2a2a;color:white;border-color:#2a2a2a">How to play</button>
          </div>
        </div>
      </div>
    </div>
    <div class="dpad" id="dpad">
      <span class="empty"></span><button data-dir="up">▲</button><span class="empty"></span>
      <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
    </div>
    <div class="hint"><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> — move &nbsp; <kbd>Space</kbd> pause</div>
  </div>

  <footer><a href="../index.html">← All games</a> • <a href="../pong/index.html">Pong</a> • <a href="../memory-match/index.html">Memory</a> • <a href="../tic-tac-toe/index.html">TicTacToe</a></footer>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const speedEl = document.getElementById('speed');
const statusEl = document.getElementById('status');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovDesc = document.getElementById('ovDesc');

const COLS = 20, ROWS = 20;
const CELL = 20; // 400/20

const LEVELS = {
  easy:   { base: 160, step: 3, min: 80 },
  medium: { base: 120, step: 4, min: 60 },
  hard:   { base: 85,  step: 5, min: 45 }
};
let level = 'medium';

let snake = [];
let dir = {x:1,y:0};
let nextDir = {x:1,y:0};
let food = {x:10,y:10};
let score = 0;
let best = parseInt(localStorage.getItem('snake-best')||'0',10);
let running = false;
let paused = false;
let gameOver = false;
let tickMs = LEVELS[level].base;
let lastTick = 0;
let rafId = null;

bestEl.textContent = best;

function showOverlay(title, desc){
  ovTitle.textContent = title;
  ovDesc.innerHTML = desc;
  overlay.classList.add('show');
}
function hideOverlay(){ overlay.classList.remove('show'); }

function resetGame(){
  const startLen = 4;
  const cx = Math.floor(COLS/2), cy = Math.floor(ROWS/2);
  snake = [];
  for(let i=0;i<startLen;i++) snake.push({x: cx - i, y: cy});
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  score = 0; tickMs = LEVELS[level].base;
  scoreEl.textContent = '0';
  speedEl.textContent = '1×';
  statusEl.textContent = 'Ready';
  gameOver = false; paused = false; running = false;
  placeFood();
  showOverlay('Snake', 'Press <b>Space</b> or tap Start<br>Use arrow keys or swipe');
  draw();
}

function placeFood(){
  let tries=0;
  do{
    food.x = Math.floor(Math.random()*COLS);
    food.y = Math.floor(Math.random()*ROWS);
    tries++;
  } while(snake.some(s=>s.x===food.x && s.y===food.y) && tries<100);
}

function setDir(nx, ny){
  // prevent reverse
  if(dir.x === -nx && dir.y === -ny) return;
  // also prevent queuing reverse via nextDir
  if(nextDir.x === -nx && nextDir.y === -ny && snake.length>1) return;
  nextDir = {x:nx,y:ny};
  if(!running && !gameOver){ start(); }
}

function start(){
  if(gameOver){ resetGame(); }
  hideOverlay();
  running = true; paused = false;
  statusEl.textContent = 'Playing';
  document.getElementById('pauseBtn').textContent='Pause';
  lastTick = performance.now();
  if(!rafId) loop();
}

function togglePause(){
  if(gameOver) return;
  if(!running){ start(); return; }
  paused = !paused;
  statusEl.textContent = paused ? 'Paused' : 'Playing';
  document.getElementById('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
  if(paused) showOverlay('Paused','Press Space or Resume to continue');
  else hideOverlay();
  if(!paused) lastTick = performance.now();
}

function gameOverFn(){
  gameOver = true; running = false; paused=false;
  best = Math.max(best, score);
  localStorage.setItem('snake-best', String(best));
  bestEl.textContent = best;
  statusEl.textContent = 'Game over';
  showOverlay(score >= best && score>0 ? 'New best!' : 'Crashed!', `${score} points • Best ${best}<br>Press Start to play again`);
  beep(180,0.25,0.18);
}

function update(){
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // wall collision
  if(head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS){
    gameOverFn(); return;
  }
  // self collision
  if(snake.some(s=>s.x===head.x && s.y===head.y)){
    gameOverFn(); return;
  }

  snake.unshift(head);

  if(head.x===food.x && head.y===food.y){
    score++;
    scoreEl.textContent = score;
    // speed up
    const cfg = LEVELS[level];
    tickMs = Math.max(cfg.min, cfg.base - score*cfg.step);
    const mult = (cfg.base / tickMs).toFixed(1);
    speedEl.textContent = mult + '×';
    beep(880,0.08,0.12);
    placeFood();
  } else {
    snake.pop();
  }
}

function draw(){
  // bg
  ctx.fillStyle = '#0f0f0f';
  ctx.fillRect(0,0,400,400);

  // subtle grid
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for(let i=0;i<=COLS;i++){ ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,400); ctx.stroke(); }
  for(let j=0;j<=ROWS;j++){ ctx.beginPath(); ctx.moveTo(0,j*CELL); ctx.lineTo(400,j*CELL); ctx.stroke(); }

  // food - pulsing circle
  const fx = food.x*CELL + CELL/2, fy = food.y*CELL + CELL/2;
  ctx.beginPath(); ctx.arc(fx, fy, 7, 0, Math.PI*2);
  ctx.fillStyle = '#ff4d4d'; ctx.fill();
  ctx.beginPath(); ctx.arc(fx, fy, 10, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,77,77,0.15)'; ctx.fill();

  // snake
  snake.forEach((s,i)=>{
    const x = s.x*CELL, y = s.y*CELL;
    const isHead = i===0;
    // rounded rect
    const pad = 1.5;
    const r = isHead ? 7 : 5;
    ctx.fillStyle = isHead ? '#9AE6B4' : (i%2===0 ? '#68D391' : '#48BB78');
    // head eye
    roundRect(x+pad, y+pad, CELL-pad*2, CELL-pad*2, r);
    ctx.fill();
    if(isHead){
      // eyes based on dir
      ctx.fillStyle = '#0f0f0f';
      const ex = x + CELL/2 + dir.x*4, ey = y + CELL/2 + dir.y*4;
      // two eyes offset perpendicular
      const px = -dir.y * 4, py = dir.x * 4;
      ctx.beginPath(); ctx.arc(ex+px, ey+py, 2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex-px, ey-py, 2, 0, Math.PI*2); ctx.fill();
    }
  });
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function beep(freq=600, dur=0.06, vol=0.12){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ac = new AC(); const o=ac.createOscillator(); const g=ac.createGain();
    o.type='square'; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(ac.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
    o.stop(ac.currentTime+dur+0.02); setTimeout(()=>ac.close(), dur*1000+100);
  }catch{}
}

function loop(now){
  rafId = requestAnimationFrame(loop);
  if(!running || paused || gameOver) return;
  if(now - lastTick >= tickMs){
    lastTick = now;
    update();
    draw();
  }
}

// input
const keyMap = {
  'ArrowUp': {x:0,y:-1}, 'w':{x:0,y:-1}, 'W':{x:0,y:-1},
  'ArrowDown':{x:0,y:1}, 's':{x:0,y:1}, 'S':{x:0,y:1},
  'ArrowLeft':{x:-1,y:0}, 'a':{x:-1,y:0}, 'A':{x:-1,y:0},
  'ArrowRight':{x:1,y:0}, 'd':{x:1,y:0}, 'D':{x:1,y:0},
};
window.addEventListener('keydown', e=>{
  if(e.key in keyMap){ e.preventDefault(); const d=keyMap[e.key]; setDir(d.x,d.y); }
  else if(e.key===' ' || e.code==='Space'){ e.preventDefault(); togglePause(); }
});
document.getElementById('dpad').addEventListener('click', e=>{
  const b = e.target.closest('button[data-dir]');
  if(!b) return;
  const m = {up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}}[b.dataset.dir];
  setDir(m.x,m.y);
});
// swipe on canvas
let touchStart=null;
canvas.addEventListener('touchstart', e=>{
  const t=e.touches[0]; touchStart={x:t.clientX,y:t.clientY};
  if(overlay.classList.contains('show')){ /* let tap start */ }
},{passive:true});
canvas.addEventListener('touchmove', e=>{
  if(!touchStart) return;
  const t=e.touches[0];
  const dx=t.clientX-touchStart.x, dy=t.clientY-touchStart.y;
  if(Math.abs(dx)<12 && Math.abs(dy)<12) return;
  if(Math.abs(dx) > Math.abs(dy)) setDir(dx>0?1:-1,0);
  else setDir(0, dy>0?1:-1);
  touchStart=null;
},{passive:true});
canvas.addEventListener('touchend', ()=>{ touchStart=null; },{passive:true});
canvas.addEventListener('click', ()=>{
  if(overlay.classList.contains('show')) start();
});

// buttons
document.getElementById('startBtn').addEventListener('click', start);
document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('restartBtn').addEventListener('click', resetGame);
document.getElementById('howBtn').addEventListener('click', ()=>{
  ovTitle.textContent='How to play';
  ovDesc.innerHTML='Eat red food to grow and score.<br>Don’t hit walls or yourself.<br>Speed increases as you eat.<br><b>Easy</b> slow • <b>Medium</b> normal • <b>Hard</b> fast<br>Arrows/WASD, swipe, or D-pad.';
  document.getElementById('startBtn').textContent='Got it';
  overlay.classList.add('show');
});
document.querySelectorAll('#level button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('#level button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    level=b.dataset.level;
    resetGame();
  });
});

// init
resetGame();
requestAnimationFrame(loop);
draw();
</script>
</body>
</html>
