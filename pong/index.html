<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f6f5f1;--card:#fff;--ink:#1a1a1a;--muted:#8a8a8a;--line:#e8e6e1;--accent:#111}
body{
  font-family:ui-sans-system,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);color:var(--ink);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:24px;-webkit-font-smoothing:antialiased;
}
.wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:22px;font-weight:800;letter-spacing:-0.03em}
.subtitle{font-size:13px;color:var(--muted);font-weight:500}
.topbar{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap
}
.score{
  display:flex;gap:18px;align-items:center;font-weight:800;letter-spacing:-0.03em
}
.score .num{font-size:22px;min-width:28px;text-align:center}
.score .sep{color:var(--muted);font-weight:600}
.controls-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mode{
  display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px
}
.mode button{border:0;background:transparent;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;cursor:pointer;color:var(--muted);transition:.15s}
.mode button.active{background:var(--accent);color:white}
.btn{
  border:1px solid var(--line);background:white;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s
}
.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}
.btn:hover{transform:translateY(-1px)}
.stage{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.04)
}
.canvas-wrap{
  position:relative;background:#0f0f0f;border-radius:14px;overflow:hidden;
  aspect-ratio: 16 / 9.2;
  border:1px solid #1e1e1e;
}
canvas{width:100%;height:100%;display:block}
.hint{
  display:flex;justify-content:space-between;gap:12px;margin-top:10px;
  font-size:11px;color:var(--muted);font-weight:600;line-height:1.5
}
.hint kbd{
  background:var(--accent);color:white;padding:2px 6px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:0.02em
}
.overlay{
  position:absolute;inset:0;display:none;place-items:center;
  background:rgba(15,15,15,0.72);backdrop-filter:blur(6px);color:white;text-align:center;padding:20px
}
.overlay.show{display:grid}
.overlay h2{font-size:22px;letter-spacing:-0.03em;margin-bottom:6px}
.overlay p{font-size:13px;color:#b9b9b9;margin-bottom:14px;line-height:1.5}
.overlay .row{display:flex;gap:10px;justify-content:center}
.overlay .btn{border-color:#2a2a2a}
footer{text-align:center;font-size:12px;color:var(--muted)}
a{color:inherit}
@media(max-width:520px){
  .hint{flex-direction:column}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pong</h1>
    <span class="subtitle">first to 5 wins</span>
  </header>

  <div class="topbar">
    <div class="score">
      <span class="num" id="scoreL">0</span><span class="sep">—</span><span class="num" id="scoreR">0</span>
      <span style="font-size:11px;color:var(--muted);font-weight:700;margin-left:6px;letter-spacing:0.06em;text-transform:uppercase" id="status">Ready</span>
    </div>
    <div class="controls-row">
      <div class="mode" id="mode">
        <button data-mode="cpu" class="active">vs CPU</button>
        <button data-mode="2p">2 Players</button>
      </div>
      <div class="mode" id="side" style="display:flex">
        <button data-side="left" class="active">Left</button>
        <button data-side="right">Right</button>
      </div>
      <div class="mode" id="level" style="display:flex">
        <button data-level="easy">Easy</button>
        <button data-level="medium" class="active">Med</button>
        <button data-level="hard">Hard</button>
      </div>
      <button class="btn" id="pauseBtn">Pause</button>
      <button class="btn primary" id="restartBtn">Restart</button>
    </div>
  </div>

  <div class="stage">
    <div class="canvas-wrap" id="wrap">
      <canvas id="c" width="800" height="440"></canvas>
      <div class="overlay show" id="startOverlay">
        <div>
          <h2 id="overlayTitle">Pong</h2>
          <p id="overlayDesc">Press <b>Space</b> or tap Start to serve</p>
          <div class="row">
            <button class="btn primary" id="startBtn">Start</button>
            <button class="btn" id="howBtn">How to play</button>
          </div>
        </div>
      </div>
    </div>
    <div class="hint" id="hint">
      <span id="hintText"><kbd>↑</kbd> <kbd>↓</kbd> — You (left) &nbsp; CPU — right</span>
      <span><kbd>Space</kbd> pause &nbsp; • &nbsp; Drag on mobile</span>
    </div>
  </div>

  <footer>
    <a href="../index.html">← All games</a> • <a href="../tic-tac-toe/index.html">Tic-Tac-Toe</a> • <a href="../memory-match/index.html">Memory Match</a>
  </footer>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreLEl = document.getElementById('scoreL');
const scoreREl = document.getElementById('scoreR');
const statusEl = document.getElementById('status');
const startOverlay = document.getElementById('startOverlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayDesc = document.getElementById('overlayDesc');

const W = 800, H = 440;
const PADDLE_W = 10, PADDLE_H = 78, BALL_R = 7;
const WIN = 5;

let mode = 'cpu'; // 'cpu' or '2p'
let playerSide = 'left'; // 'left' or 'right' - only for cpu mode
let cpuLevel = 'medium'; // 'easy' | 'medium' | 'hard'
const LEVELS = {
  easy:   { ballSpeed: 4.2, speedUp: 1.025, cpuTrackToward: 0.055, cpuTrackAway: 0.025, cpuMax: 3.8 },
  medium: { ballSpeed: 5.2, speedUp: 1.045, cpuTrackToward: 0.09,  cpuTrackAway: 0.04,  cpuMax: 5.0 },
  hard:   { ballSpeed: 6.6, speedUp: 1.07,  cpuTrackToward: 0.13,  cpuTrackAway: 0.065, cpuMax: 7.2 }
};
let scoreL = 0, scoreR = 0;
let paused = false;
let running = false;
let gameOver = false;

const left = { x: 18, y: H/2 - PADDLE_H/2, vy: 0, h: PADDLE_H };
const right = { x: W - 18 - PADDLE_W, y: H/2 - PADDLE_H/2, vy: 0, h: PADDLE_H };
const ball = { x: W/2, y: H/2, vx: 0, vy: 0, r: BALL_R };

const keys = {};
let touchLY = null; // normalized 0..1 for left touch
let touchRY = null;

function resetBall(dir = Math.random() > 0.5 ? 1 : -1) {
  ball.x = W/2; ball.y = H/2;
  const cfg = LEVELS[cpuLevel];
  const speed = mode === 'cpu' ? cfg.ballSpeed : 5.2;
  const angle = (Math.random()*0.6 - 0.3);
  ball.vx = dir * speed * Math.cos(angle);
  ball.vy = speed * Math.sin(angle) + (Math.random()*2 - 1);
  if (Math.abs(ball.vy) < 1.2) ball.vy = ball.vy > 0 ? 1.2 : -1.2;
}

function resetGame() {
  scoreL = 0; scoreR = 0; gameOver = false;
  scoreLEl.textContent = '0'; scoreREl.textContent = '0';
  left.y = H/2 - PADDLE_H/2; right.y = H/2 - PADDLE_H/2;
  resetBall();
  running = false; paused = false;
  statusEl.textContent = 'Ready';
  showStart('Pong', 'Press Space or tap Start to serve');
}

function showStart(title, desc) {
  overlayTitle.textContent = title;
  overlayDesc.innerHTML = desc;
  startOverlay.classList.add('show');
}
function hideStart() { startOverlay.classList.remove('show'); }

function serve() {
  if (gameOver) { resetGame(); return; }
  hideStart();
  running = true; paused = false;
  statusEl.textContent = 'Playing';
  document.getElementById('pauseBtn').textContent = 'Pause';
}

function beep(freq=600, dur=0.06, vol=0.12) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = new AC();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(ac.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.stop(ac.currentTime + dur + 0.02);
    setTimeout(()=>ac.close(), dur*1000+100);
  } catch {}
}

function clampPaddle(p) {
  if (p.y < 6) p.y = 6;
  if (p.y > H - p.h - 6) p.y = H - p.h - 6;
}

function update() {
  if (!running || paused || gameOver) return;

  // input -> paddle velocity
  const speed = 6.2;
  function cpuMove(p, isRight) {
    const cfg = LEVELS[cpuLevel];
    const center = p.y + p.h/2;
    const diff = ball.y - center;
    const toward = isRight ? ball.vx > 0 : ball.vx < 0;
    const track = toward ? cfg.cpuTrackToward : cfg.cpuTrackAway;
    let vy = diff * track;
    vy = Math.max(-cfg.cpuMax, Math.min(cfg.cpuMax, vy));
    p.y += vy;
  }
  if (mode === 'cpu') {
    if (playerSide === 'left') {
      // human left -> arrows + touch left, CPU right
      if (touchLY !== null) {
        const target = touchLY * H - left.h/2;
        left.y += (target - left.y) * 0.25;
      } else {
        let ly = 0;
        if (keys['ArrowUp']) ly -= speed;
        if (keys['ArrowDown']) ly += speed;
        if (keys['w'] || keys['W']) ly -= speed;
        if (keys['s'] || keys['S']) ly += speed;
        left.y += ly;
      }
      cpuMove(right, true);
    } else {
      // human right -> arrows + touch right, CPU left
      if (touchRY !== null) {
        const target = touchRY * H - right.h/2;
        right.y += (target - right.y) * 0.25;
      } else {
        let ry = 0;
        if (keys['ArrowUp']) ry -= speed;
        if (keys['ArrowDown']) ry += speed;
        if (keys['w'] || keys['W']) ry -= speed;
        if (keys['s'] || keys['S']) ry += speed;
        right.y += ry;
      }
      cpuMove(left, false);
    }
  } else {
    // 2P
    if (touchLY !== null) {
      const target = touchLY * H - left.h/2;
      left.y += (target - left.y) * 0.25;
    } else {
      let ly = 0;
      if (keys['w'] || keys['W']) ly -= speed;
      if (keys['s'] || keys['S']) ly += speed;
      left.y += ly;
    }
    if (touchRY !== null) {
      const target = touchRY * H - right.h/2;
      right.y += (target - right.y) * 0.25;
    } else {
      let ry = 0;
      if (keys['ArrowUp']) ry -= speed;
      if (keys['ArrowDown']) ry += speed;
      right.y += ry;
    }
  }
  clampPaddle(left); clampPaddle(right);

  // ball move
  ball.x += ball.vx;
  ball.y += ball.vy;

  // top/bottom wall
  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; beep(420, .05); }
  if (ball.y + ball.r > H) { ball.y = H - ball.r; ball.vy *= -1; beep(420, .05); }

  // paddle collision
  function collide(p) {
    if (ball.x - ball.r < p.x + PADDLE_W &&
        ball.x + ball.r > p.x &&
        ball.y + ball.r > p.y &&
        ball.y - ball.r < p.y + p.h) {
      // reposition outside
      if (ball.vx < 0) ball.x = p.x + PADDLE_W + ball.r;
      else ball.x = p.x - ball.r;
      ball.vx *= -1;
      // angle based on hit position
      const hit = (ball.y - (p.y + p.h/2)) / (p.h/2); // -1 to 1
      ball.vy = hit * 5.2 + ball.vy * 0.15;
      // speed up per level
      const su = mode === 'cpu' ? LEVELS[cpuLevel].speedUp : 1.045;
      ball.vx *= su;
      ball.vy *= (su > 1 ? 1 + (su-1)*0.6 : 1);
      // cap
      ball.vx = Math.max(-10, Math.min(10, ball.vx));
      beep(740, .05);
      return true;
    }
    return false;
  }
  if (ball.vx < 0) collide(left);
  else collide(right);

  // scoring
  if (ball.x < -12) {
    scoreR++; scoreREl.textContent = scoreR; beep(220, .18, .18);
    checkWin(); if (!gameOver) { resetBall(1); running = false; showStart('Point!', 'Right scores — press Space to serve'); statusEl.textContent = 'Serve'; }
  }
  if (ball.x > W + 12) {
    scoreL++; scoreLEl.textContent = scoreL; beep(220, .18, .18);
    checkWin(); if (!gameOver) { resetBall(-1); running = false; showStart('Point!', 'Left scores — press Space to serve'); statusEl.textContent = 'Serve'; }
  }
}

function checkWin() {
  if (scoreL >= WIN || scoreR >= WIN) {
    gameOver = true; running = false;
    const winner = scoreL >= WIN ? 'Left wins!' : 'Right wins!';
    const humanWon = playerSide === 'left' ? scoreL >= WIN : scoreR >= WIN;
    const cpuText = mode === 'cpu' ? (humanWon ? 'You win!' : 'CPU wins!') : winner;
    showStart(cpuText, `${scoreL} — ${scoreR} • First to ${WIN}. Press Start to play again`);
    statusEl.textContent = 'Game over';
    beep(880, .3, .16);
  }
}

function draw() {
  // clear
  ctx.clearRect(0,0,W,H);
  // bg
  ctx.fillStyle = '#0f0f0f';
  ctx.fillRect(0,0,W,H);
  // middle line dashed
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.setLineDash([8,10]);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(W/2, 8); ctx.lineTo(W/2, H-8);
  ctx.stroke();
  ctx.setLineDash([]);
  // center circle
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(W/2, H/2, 68, 0, Math.PI*2); ctx.stroke();
  // paddles
  ctx.fillStyle = '#ffffff';
  // rounded paddles via rect with radius
  function rrect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill();
  }
  rrect(left.x, left.y, PADDLE_W, left.h, 4);
  rrect(right.x, right.y, PADDLE_W, right.h, 4);
  // ball
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fillStyle = '#ffffff'; ctx.fill();
  // subtle glow
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r+6, 0, Math.PI*2); ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fill();
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }

// input
window.addEventListener('keydown', (e) => {
  keys[e.key] = true;
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    if (startOverlay.classList.contains('show')) serve();
    else {
      paused = !paused;
      statusEl.textContent = paused ? 'Paused' : 'Playing';
      document.getElementById('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
      if (paused) showStart('Paused', 'Press Space or Resume to continue');
      else hideStart();
    }
  }
});
window.addEventListener('keyup', (e) => { keys[e.key] = false; });

// touch drag on canvas
const wrap = document.getElementById('wrap');
function getTouchPos(e){
  const rect = canvas.getBoundingClientRect();
  const t = e.touches[0];
  if(!t) return null;
  const y = (t.clientY - rect.top) / rect.height;
  const x = (t.clientX - rect.left) / rect.width;
  return {x,y};
}
canvas.addEventListener('touchstart', (e)=>{
  e.preventDefault();
  const p = getTouchPos(e);
  if(!p) return;
  if(p.x < 0.5) touchLY = p.y; else touchRY = p.y;
  if(startOverlay.classList.contains('show')) serve();
}, {passive:false});
canvas.addEventListener('touchmove', (e)=>{
  e.preventDefault();
  const p = getTouchPos(e);
  if(!p) return;
  // if first touch was left half, keep updating same side; but simpler: update both based on x
  if(p.x < 0.5) touchLY = p.y; else touchRY = p.y;
}, {passive:false});
canvas.addEventListener('touchend', (e)=>{
  e.preventDefault();
  // release after short delay to allow CPU to take over again
  if(e.touches.length === 0){ touchLY = null; touchRY = null; }
}, {passive:false});
canvas.addEventListener('click', ()=>{
  if(startOverlay.classList.contains('show')) serve();
});

// buttons
document.getElementById('startBtn').addEventListener('click', serve);
document.getElementById('pauseBtn').addEventListener('click', ()=>{
  if(gameOver || !running && !paused) {
    if(startOverlay.classList.contains('show')) serve();
    return;
  }
  if(startOverlay.classList.contains('show') && paused){ hideStart(); paused=false; statusEl.textContent='Playing'; document.getElementById('pauseBtn').textContent='Pause'; return; }
  paused = !paused;
  statusEl.textContent = paused ? 'Paused' : 'Playing';
  document.getElementById('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
  if(paused) showStart('Paused', 'Tap Resume to continue'); else hideStart();
});
document.getElementById('restartBtn').addEventListener('click', resetGame);
function updateSideUI(){
  document.getElementById('side').style.display = mode === 'cpu' ? 'flex' : 'none';
  document.getElementById('level').style.display = mode === 'cpu' ? 'flex' : 'none';
}
function updateHint(){
  const el = document.getElementById('hintText');
  if(mode === 'cpu') {
    const side = playerSide === 'left' ? 'left' : 'right';
    const cpu = playerSide === 'left' ? 'right' : 'left';
    el.innerHTML = `<kbd>↑</kbd> <kbd>↓</kbd> — You (${side}) &nbsp; CPU — ${cpu}`;
  } else {
    el.innerHTML = '<kbd>W</kbd> <kbd>S</kbd> — Left &nbsp; <kbd>↑</kbd> <kbd>↓</kbd> — Right';
  }
}
document.getElementById('howBtn').addEventListener('click', ()=>{
  overlayTitle.textContent = 'How to play';
  if(mode === 'cpu'){
    overlayDesc.innerHTML = `First to 5 wins.<br><b>vs CPU:</b> you = <b>${playerSide}</b> — <b>↑/↓</b> (or W/S) or drag ${playerSide} side<br><b>2 Players:</b> left W/S — right ↑/↓ or both drag<br><br>Level: <b>${cpuLevel}</b> — Easy: slow ball + slow CPU • Medium: normal • Hard: fast ball + fast CPU<br>Switch with Easy/Med/Hard and Left/Right while in vs CPU.`;
  } else {
    overlayDesc.innerHTML = 'First to 5 wins.<br><b>vs CPU:</b> you = left/right — <b>↑/↓</b> (or W/S) or drag your side<br><b>2 Players:</b> left W/S — right ↑/↓ or both drag';
  }
  document.getElementById('startBtn').textContent = 'Got it';
});
document.querySelectorAll('#mode button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('#mode button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    mode = b.dataset.mode;
    updateSideUI();
    updateHint();
    resetGame();
  });
});
document.querySelectorAll('#side button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('#side button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    playerSide = b.dataset.side;
    updateHint();
    resetGame();
  });
});
document.querySelectorAll('#level button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('#level button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    cpuLevel = b.dataset.level;
    resetGame();
  });
});

// init
updateSideUI();
updateHint();
resetBall();
loop();
draw();
</script>
</body>
</html>
