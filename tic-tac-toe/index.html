<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f6f5f1;
    --card: #ffffff;
    --ink: #1a1a1a;
    --muted: #8a8a8a;
    --line: #e8e6e1;
    --accent: #111111;
    --radius: 20px;
  }
  body {
    font-family: ui-sans-system, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  h1 {
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.03em;
  }
  .subtitle {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.04);
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    gap: 12px;
  }
  .turn {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 600;
  }
  .turn-dot {
    width: 28px;
    height: 28px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    font-size: 13px;
    font-weight: 800;
    background: var(--accent);
    color: white;
  }
  .turn span { letter-spacing: -0.02em; }
  .mode-toggle {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .mode-toggle button {
    border: 0;
    background: transparent;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 999px;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.15s;
  }
  .mode-toggle button.active {
    background: var(--accent);
    color: white;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    background: transparent;
  }
  .cell {
    aspect-ratio: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    display: grid;
    place-items: center;
    font-size: 36px;
    font-weight: 750;
    cursor: pointer;
    transition: all 0.12s ease;
    user-select: none;
    line-height: 1;
    color: var(--ink);
  }
  .cell:hover:not(.taken):not(.disabled) {
    background: #ffffff;
    border-color: #d6d3cc;
    transform: translateY(-1px);
  }
  .cell.taken { cursor: default; }
  .cell.win {
    background: var(--accent) !important;
    color: white !important;
    border-color: var(--accent) !important;
  }
  .cell:disabled { pointer-events: none; }
  .status {
    text-align: center;
    margin-top: 16px;
    font-size: 14px;
    font-weight: 600;
    min-height: 20px;
    letter-spacing: -0.02em;
  }
  .status.muted { color: var(--muted); font-weight: 500; }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .btn {
    flex: 1;
    border: 1px solid var(--line);
    background: white;
    padding: 11px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 650;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0px); }
  .score {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    text-align: center;
  }
  .score-box {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 8px;
  }
  .score-box .label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .score-box .value {
    font-size: 20px;
    font-weight: 800;
    margin-top: 4px;
    letter-spacing: -0.03em;
  }
  footer {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  @media (max-width: 400px) {
    .wrap { max-width: 100%; }
    .card { padding: 18px; }
    .cell { font-size: 32px; border-radius: 14px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Tic Tac Toe</h1>
      <span class="subtitle">first to 3 in a row</span>
    </header>

    <div class="score">
      <div class="score-box"><div class="label">Player X</div><div class="value" id="scoreX">0</div></div>
      <div class="score-box"><div class="label">Draws</div><div class="value" id="scoreD">0</div></div>
      <div class="score-box"><div class="label">Player O</div><div class="value" id="scoreO">0</div></div>
    </div>

    <div class="card">
      <div class="top-row">
        <div class="turn">
          <div class="turn-dot" id="turnDot">X</div>
          <span id="turnText">X to move</span>
        </div>
        <div class="mode-toggle">
          <button id="btn2P" class="active">2 Players</button>
          <button id="btnVs">vs Computer</button>
        </div>
      </div>

      <div class="board" id="board"></div>
      <div class="status muted" id="status">X goes first</div>
      <div class="actions">
        <button class="btn" id="resetBoard">Reset board</button>
        <button class="btn primary" id="resetScore">New game</button>
      </div>
    </div>

    <footer>Play locally — no install needed. Tip: in vs Computer, you are X.</footer>
  </div>

<script>
const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const turnDot = document.getElementById('turnDot');
const turnText = document.getElementById('turnText');
const scoreXEl = document.getElementById('scoreX');
const scoreOEl = document.getElementById('scoreO');
const scoreDEl = document.getElementById('scoreD');
const btn2P = document.getElementById('btn2P');
const btnVs = document.getElementById('btnVs');

let board = Array(9).fill('');
let current = 'X';
let gameOver = false;
let vsComputer = false;
let scores = { X: 0, O: 0, D: 0 };

const wins = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

function renderBoard() {
  boardEl.innerHTML = '';
  board.forEach((val, i) => {
    const btn = document.createElement('button');
    btn.className = 'cell' + (val ? ' taken' : '') + (gameOver ? ' disabled' : '');
    btn.textContent = val;
    btn.setAttribute('aria-label', `cell ${i+1}`);
    btn.addEventListener('click', () => handleMove(i));
    boardEl.appendChild(btn);
  });
}

function updateTurnUI() {
  turnDot.textContent = current;
  turnText.textContent = gameOver ? 'Game over' : `${current} to move`;
}

function checkWinner(b = board) {
  for (const [a,c,d] of wins) {
    if (b[a] && b[a] === b[c] && b[a] === b[d]) return { winner: b[a], line: [a,c,d] };
  }
  if (b.every(v => v)) return { winner: 'draw' };
  return null;
}

function highlight(line) {
  const cells = boardEl.querySelectorAll('.cell');
  line.forEach(i => cells[i].classList.add('win'));
}

function handleMove(i) {
  if (board[i] || gameOver) return;
  board[i] = current;
  renderBoard();
  const result = checkWinner();
  if (result) {
    gameOver = true;
    if (result.winner === 'draw') {
      statusEl.textContent = "It's a draw!";
      statusEl.className = 'status';
      scores.D++; scoreDEl.textContent = scores.D;
    } else {
      statusEl.textContent = `${result.winner} wins!`;
      statusEl.className = 'status';
      scores[result.winner]++; 
      if (result.winner === 'X') scoreXEl.textContent = scores.X;
      else scoreOEl.textContent = scores.O;
      highlight(result.line);
    }
    updateTurnUI();
    return;
  }
  current = current === 'X' ? 'O' : 'X';
  updateTurnUI();
  statusEl.textContent = vsComputer && current === 'O' ? 'Computer thinking...' : `${current}'s turn`;
  statusEl.className = 'status muted';

  if (vsComputer && current === 'O' && !gameOver) {
    setTimeout(computerMove, 380);
  }
}

function computerMove() {
  if (gameOver) return;
  // try win, then block, then center/corners
  let move = findBestMove('O') ?? findBestMove('X');
  if (move == null) {
    const empties = board.map((v,i) => v ? null : i).filter(v => v !== null);
    // prefer center, then corners, then edges
    const pref = [4,0,2,6,8,1,3,5,7];
    move = pref.find(i => empties.includes(i));
  }
  if (move != null) handleMove(move);
}

function findBestMove(player) {
  for (const [a,b,c] of wins) {
    const line = [board[a], board[b], board[c]];
    const idx = [a,b,c];
    const countPlayer = line.filter(v => v === player).length;
    const countEmpty = line.filter(v => !v).length;
    if (countPlayer === 2 && countEmpty === 1) {
      return idx[line.indexOf('')];
    }
  }
  return null;
}

function resetBoard() {
  board = Array(9).fill('');
  current = 'X';
  gameOver = false;
  statusEl.textContent = 'X goes first';
  statusEl.className = 'status muted';
  renderBoard();
  updateTurnUI();
}

function resetScores() {
  scores = { X: 0, O: 0, D: 0 };
  scoreXEl.textContent = '0';
  scoreOEl.textContent = '0';
  scoreDEl.textContent = '0';
  resetBoard();
}

document.getElementById('resetBoard').addEventListener('click', resetBoard);
document.getElementById('resetScore').addEventListener('click', resetScores);

btn2P.addEventListener('click', () => {
  vsComputer = false;
  btn2P.classList.add('active');
  btnVs.classList.remove('active');
  resetBoard();
});
btnVs.addEventListener('click', () => {
  vsComputer = true;
  btnVs.classList.add('active');
  btn2P.classList.remove('active');
  resetBoard();
});

// init
renderBoard();
updateTurnUI();
</script>
</body>
</html>
